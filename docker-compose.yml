name: tamyr-pop

services:
  postgres:
    image: postgres:16-alpine
    container_name: tamyr-pop-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: tamyr_pop
      POSTGRES_USER: tamyr
      POSTGRES_PASSWORD: tamyr_local_password
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tamyr -d tamyr_pop"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - tamyr_postgres_data:/var/lib/postgresql/data

volumes:
  tamyr_postgres_data:
